# 直连列表

# =====================================================================
# 👇 【配置方式完全指南】（请根据需要选择，注意每条前面有 "- "）
# =====================================================================

# 【域名类匹配】（最常用）
# 1. DOMAIN-SUFFIX （后缀匹配）
#    作用：匹配该域名及所有子域名。示例：google.com 匹配 www.google.com
#    格式：- DOMAIN-SUFFIX,你的域名

# 2. DOMAIN （完整匹配）
#    作用：只匹配完全一样的域名，不包含子域名。
#    格式：- DOMAIN,www.example.com

# 3. DOMAIN-KEYWORD （关键字匹配）
#    作用：只要网址里包含这个词就匹配。
#    格式：- DOMAIN-KEYWORD,google

# 【IP类匹配】
# 4. IP-CIDR （IPv4 网段匹配）
#    作用：匹配特定的 IP 段。通常用于局域网或特定服务器。
#    格式：- IP-CIDR,192.168.1.0/24,no-resolve

# 5. IP-CIDR6 （IPv6 网段匹配）
#    作用：匹配 IPv6 段。
#    格式：- IP-CIDR6,2001:db8::/32,no-resolve

# 6. GEOIP （IP 归属地匹配）
#    作用：根据 IP 所在国家匹配。（注意：在规则集里较少用，通常直接写在主配置里）
#    格式：- GEOIP,CN

# ⚠️ 关于 no-resolve：
# 写在 IP 规则最后，表示“如果是域名请求，直接跳过此规则，不要为了匹配而强行解析它的IP”。
# =====================================================================

