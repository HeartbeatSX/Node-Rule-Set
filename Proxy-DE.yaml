# 【域名类匹配】
# 1. DOMAIN-SUFFIX （后缀匹配 - 最常用）
#    格式：- DOMAIN-SUFFIX,openai.com,♻️ 美国自动

# 2. DOMAIN （完整匹配 - 最严格）
#    格式：- DOMAIN,www.example.com,♻️ 美国自动

# 3. DOMAIN-KEYWORD （关键字匹配 - 最宽泛）
#    格式：- DOMAIN-KEYWORD,telegram,📲 Telegram

# 【IP类匹配】
# 4. IP-CIDR （IPv4 网段匹配）
#    作用：强制某些特定 IP 走代理。
#    示例：- IP-CIDR,8.8.8.8/32,🚀 默认代理,no-resolve

# 5. IP-CIDR6 （IPv6 网段匹配）
#    示例：- IP-CIDR6,2001:4860:4860::8888/128,🚀 默认代理,no-resolve

# 6. GEOIP （IP 归属地匹配）
#    作用：如果你想让所有非中国大陆的 IP 都走代理（通常不在规则集里用，在主配置里写）。
#    示例：- GEOIP,CN,DIRECT（主配置写法）

# ⚠️ 关于 no-resolve：写在规则最后，防止内核为了匹配 IP 去强行解析域名。
